name: Windows Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Build user guide
        run: python scripts/build_user_guide_pdf.py --output dist\DFS-Optimizer-User-Guide.pdf

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name DFS-Optimizer
          --collect-all pulp
          app.py

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath "dist\DFS-Optimizer.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DFS-Optimizer.exe" | Set-Content -LiteralPath "dist\DFS-Optimizer.exe.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: DFS-Optimizer-Windows-${{ github.run_id }}
          path: |
            dist/DFS-Optimizer.exe
            dist/DFS-Optimizer.exe.sha256
            dist/DFS-Optimizer-User-Guide.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist\DFS-Optimizer.exe" "dist\DFS-Optimizer.exe.sha256" "dist\DFS-Optimizer-User-Guide.pdf" --repo $repo --clobber
          } else {
            gh release create $tag "dist\DFS-Optimizer.exe" "dist\DFS-Optimizer.exe.sha256" "dist\DFS-Optimizer-User-Guide.pdf" --repo $repo --title "DFS Optimizer $tag" --generate-notes --verify-tag
          }
